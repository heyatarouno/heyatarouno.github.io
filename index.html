<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キャラクター紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>キャラクター紹介</h1>

<div class="character">
  <img src="images/char1.jpg" alt="ベル">
  <div class="text">
    <h2>ベル</h2>
    <p>マイペースな男の子。散歩中に気になるものを見つけると進路を勝手に変えたり，立ち止まって動かなくなったりする。犬種は不明だがテリア系っぽい。テンションが上がると真顔のままで暴れる不思議な子。</p>
  </div>
</div>

<div class="character">
  <img src="images/char2.jpg" alt="ベルの飼い主">
  <div class="text">
    <h2>ベルの飼い主</h2>
    <p>ベルの散歩をめんどくさそうにしているが，本心ではベルとの生活を楽しんでいる。</p>
  </div>
</div>

<div class="character">
  <img src="images/char3.jpg" alt="ロウジーの女の子">
  <div class="text">
    <h2>ロウジーの女の子</h2>
    <p>毎日の考え事をノートに書き留めている。</p>
  </div>
</div>

<div class="character">
  <img src="images/char4.jpg" alt="コノちゃん">
  <div class="text">
    <h2>コノちゃん</h2>
    <p>廃墟に家具を持ち込んで勝手に住んでいる。多分犯罪。</p>
  </div>
</div>

</body>
</html>
